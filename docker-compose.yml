services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medivoice
      POSTGRES_USER: medivoice
      POSTGRES_PASSWORD: medivoice_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medivoice -d medivoice"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    ports:
      - '3000:5173'
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
      - DATABASE_URL=postgresql://medivoice:medivoice_dev_password@db:5432/medivoice
      - SECRET_KEY=development-only-change-this-secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  frontend_node_modules:
  postgres_data:
