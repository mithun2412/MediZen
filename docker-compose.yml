version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '3000:4173'
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
